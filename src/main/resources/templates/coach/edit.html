
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Coach</title>
</head>

<body>

<div class="container">

    <div class="page-header">
        <div>
            <h1>Edit Coach</h1>
            <p class="subtitle">
                Update the coach details.
            </p>
        </div>

        <img src="/images/KTCL.png" alt="Kildare Tennis Club" class="logo">

    </div>

    <div class="card">

        <form
                th:action="@{/coaches/{id}(id=${coachId})}"
                th:object="${coachForm}"
                method="post">

            <!-- Coach Name -->
            <div class="form-group">

                <label for="coachName">Coach Name</label>

                <input
                        id="coachName"
                        type="text"
                        th:field="*{coachName}"
                        th:classappend="${#fields.hasErrors('coachName')} ? 'input-error'">

                <div class="field-hint">
                    Enter the coach's full name.
                </div>

                <div
                        class="field-error"
                        th:if="${#fields.hasErrors('coachName')}"
                        th:errors="*{coachName}">

                </div>

            </div>

            <!-- Coach Email-->
            <div class="form-group">

                <label for="coachEmail">Coach Email</label>

                <input
                        id="coachEmail"
                        type="email"
                        th:field="*{coachEmail}"
                        th:classappend="${#fields.hasErrors('coachEmail')} ? 'input-error'">

                <div class="field-hint">
                    Enter the coach's email address.
                </div>

                <div
                        class="field-error"
                        th:if="${#fields.hasErrors('coachEmail')}"
                        th:errors="*{coachEmail}">
                </div>

            </div>

            <!-- Actions -->
            <div class="form-actions">

                <a th:href="@{/coaches}"
                   class="btn btn-secondary">
                    Cancel
                </a>

                <button
                        type="submit"
                        class="btn btn-primary">
                    Update Coach
                </button>

            </div>

        </form>

    </div>

    <div class="footer">
        Advanced Web Development - Tennis Club Website
    </div>

</div>

</body>
</html>
